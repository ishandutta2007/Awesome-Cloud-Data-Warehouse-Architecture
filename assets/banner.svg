<svg xmlns="http://www.w3.org/2000/svg" width="100%" height="100%" viewBox="0 0 1200 420"><defs><linearGradient id="bg-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#0a0f1d"/><stop offset="50%" stop-color="#0e172a"/><stop offset="100%" stop-color="#060913"/></linearGradient><linearGradient id="cyan-blue-grad" x1="0%" x2="100%" y1="0%" y2="0%"><stop offset="0%" stop-color="#38bdf8"/><stop offset="50%" stop-color="#818cf8"/><stop offset="100%" stop-color="#c084fc"/></linearGradient><linearGradient id="pill-grad" x1="0%" x2="100%" y1="0%" y2="100%"><stop offset="0%" stop-color="#1e293b" stop-opacity=".85"/><stop offset="100%" stop-color="#0f172a" stop-opacity=".95"/></linearGradient><radialGradient id="orb-glow-1" cx="20%" cy="30%" r="50%"><stop offset="0%" stop-color="#38bdf8" stop-opacity=".25"/><stop offset="100%" stop-color="#38bdf8" stop-opacity="0"/></radialGradient><radialGradient id="orb-glow-2" cx="80%" cy="70%" r="50%"><stop offset="0%" stop-color="#818cf8" stop-opacity=".22"/><stop offset="100%" stop-color="#818cf8" stop-opacity="0"/></radialGradient><pattern id="grid-pattern" width="40" height="40" patternUnits="userSpaceOnUse"><path fill="none" stroke="#334155" stroke-opacity=".3" stroke-width=".75" d="M 40 0 L 0 0 0 40"/></pattern><filter id="shadow" width="120%" height="120%" x="-10%" y="-10%"><feDropShadow dx="0" dy="8" flood-color="#000" flood-opacity=".6" stdDeviation="12"/></filter><style>@keyframes floatSlow{0%{transform:translateY(0) rotate(0deg)}50%{transform:translateY(-12px) rotate(1deg)}}@keyframes pulseGlow{0%{opacity:.35;transform:scale(1)}50%{opacity:.7;transform:scale(1.08)}}@keyframes nodePulse{0%{r:4;opacity:.5}50%{r:6.5;opacity:1}}.floating-node-1{animation:floatSlow 7s ease-in-out infinite}.floating-node-2{animation:floatSlow 9s ease-in-out 1.5s infinite}.pulse-glow-layer{animation:pulseGlow 6s ease-in-out infinite alternate}.data-flow-line{stroke-dasharray:8 6;animation:dashMove 5s linear infinite}.node-pulse-