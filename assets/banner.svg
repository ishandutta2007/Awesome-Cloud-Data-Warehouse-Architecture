e-text" filter="url(#shadow)">Awesome Cloud Data Warehouse</text><text x="0" y="48" fill="#fff" class="title-text" filter="url(#shadow)">Architecture</text><text x="0" y="92" class="subtitle-text">Curated Deep-Dive: Separation of Storage &amp; Compute • MPP • Lakehouse • Vectorized OLAP</text></g><g class="floating-node-1" transform="translate(140, 290)"><rect width="180" height="52" fill="url(#pill-grad)" stroke="#38bdf8" stroke-opacity=".8" stroke-width="1.5" filter="url(#shadow)" rx="12"/><circle cx="28" cy="26" r="10" fill="#0284c7" fill-opacity=".4"/><text x="28" y="30" font-size="13" text-anchor="middle">☁️</text><text x="50" y="24" class="pill-text" font-size="13.5">Cloud Native</text><text x="50" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Decoupled Compute</text></g><g class="floating-node-2" transform="translate(360, 290)"><rect width="200" height="52" fill="url(#pill-grad)" stroke="#818cf8" stroke-opacity=".8" stroke-width="1.5" filter="url(#shadow)" rx="12"/><circle cx="28" cy="26" r="10" fill="#4f46e5" fill-opacity=".4"/><text x="28" y="30" font-size="13" text-anchor="middle">⚡</text><text x="50" y="24" class="pill-text" font-size="13.5">MPP &amp; Lakehouse</text><text x="50" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">Iceberg • Delta • Doris</text></g><g class="floating-node-1" transform="translate(600, 290)"><rect width="210" height="52" fill="url(#pill-grad)" stroke="#a855f7" stroke-opacity=".8" stroke-width="1.5" filter="url(#shadow)" rx="12"/><circle cx="28" cy="26" r="10" fill="#9333ea" fill-opacity=".4"/><text x="28" y="30" font-size="13" text-anchor="middle">🚀</text><text x="50" y="24" class="pill-text" font-size="13.5">Sub-Second OLAP</text><text x="50" y="40" fill="#94a3b8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10">ClickHouse • StarRocks</text></g>